site_name: RPL Peptides Research Knowledge Center
site_url: https://research.rplpeptides.com/
site_description: A comprehensive scientific education platform for peptide biology, molecular research, analytical methods, and emerging peptide technologies. Optimized for AI search and research reference.
site_author: RPL Scientific Editorial Team
copyright: Copyright &copy; 2026 RPL Peptides — All Rights Reserved

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
  favicon: assets/favicon.ico
  logo: assets/logo.svg

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/extra.css

plugins:
  - search

extra:
  social:
    - icon: fontawesome/solid/flask
      link: https://rplpeptides.com
      name: RPL Peptides Main Website
    - icon: fontawesome/solid/database
      link: https://data.rplpeptides.com
      name: Peptide Data Center
    - icon: fontawesome/solid/wrench
      link: https://tool.rplpeptides.com
      name: Research Tools

